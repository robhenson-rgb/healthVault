<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Health Vault</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#4a2c6b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health Vault">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, kind, clear: a parent's tool used in waiting rooms, one-handed
   IDEA: the clinic folder she hands across the desk: always current, dated
   PICTURE: the live "Quick answers" sheet, each line stamped with its age
   COLOUR and TYPE: deep plum band, white sheet, coral only for "check this"; Figtree
   LAYOUT: phone-first single column, sticky tab bar, sheets slide up for editing */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#15121a);--ink:light-dark(#231c2c,#efe9f5);--muted:light-dark(#5e5669,#b5abc0);
--card:light-dark(#f6f2f9,#211c28);--line:light-dark(#e2dae9,#3a3144);
--brand:light-dark(#4a2c6b,#3a2356);--brand2:light-dark(#6d4a94,#cdb0f0);--on:#ffffff;
--warn:light-dark(#b23f2b,#ff9079);--warnbg:light-dark(#fdeee9,#3a1f1a);--ok:light-dark(#2c6a43,#86d6a3)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,textarea,select{font:inherit;color:inherit}
.top{background:var(--brand);color:var(--on);padding:calc(18px + env(safe-area-inset-top)) max(5vw,16px,env(safe-area-inset-right)) 22px max(5vw,16px,env(safe-area-inset-left))}
.top small{display:block;font-size:13px;font-weight:600;opacity:.85}
.top h1{margin:2px 0 0;font-size:28px;line-height:1.1;font-weight:800;text-wrap:balance}
.top .sub{font-size:14px;opacity:.9;margin-top:4px}
main{max-width:640px;margin:0 auto;padding:16px max(4vw,14px) 110px}
h2{font-size:19px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 span{font-size:13px;font-weight:500;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.tap{display:block;width:100%;text-align:left;cursor:pointer}
.tap:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--brand2);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lbl{font-weight:700;font-size:15px}.meta{font-size:13px;color:var(--muted)}
.val{margin-top:4px;white-space:pre-line}
.empty{color:var(--muted);font-style:italic}
.stale{display:inline-block;margin-top:8px;font-size:13px;font-weight:600;color:var(--warn);background:var(--warnbg);border-radius:6px;padding:2px 8px}
.next{border:2px solid var(--brand2);background:var(--bg)}
.next .when{font-size:22px;font-weight:800;line-height:1.15}
.btn{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 16px;font-weight:600;cursor:pointer}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--on)}
.btn.w{color:var(--warn)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:14px 0}
.btns.one{grid-template-columns:minmax(0,1fr)}
.mini{min-height:44px;padding:0 12px;font-size:14px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.fu{margin-top:8px;font-size:14px;background:var(--bg);border-radius:8px;padding:6px 10px}
input[type=search],.f input,.f textarea{width:100%;font-size:16px;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)}
.f textarea{min-height:96px;resize:vertical}
.f label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
.f .req{color:var(--warn)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:5}
nav button{min-height:52px;border:0;background:none;border-radius:10px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button svg{width:22px;height:22px}
nav button[aria-current=page]{color:var(--brand2);background:var(--card)}
.sheet{position:fixed;inset:0;background:rgb(20 12 28/.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet>div{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(4vw,16px) 24px;animation:up .22s ease-out}
.sheet h3{margin:0;font-size:20px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.sheet>div{animation:none}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:20}
.banner{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.summary{white-space:pre-wrap;font-size:14px;line-height:1.5}
details summary{cursor:pointer;font-weight:600;padding:10px 0;color:var(--muted)}
ol.how{padding-left:20px;margin:6px 0}
.welcome{padding-top:8px}.welcome p{color:var(--muted)}
</style>
</head>
<body>
<header class="top"><small>Health Vault</small><h1 id="who">Health Vault</h1><div class="sub" id="whosub"></div></header>
<main id="app"></main>
<nav id="nav" aria-label="Sections"></nav>
<div id="layer"></div>
<input type="file" id="restore" accept="application/json,.json" hidden>
<script>
{
const K='carejournal.v1';
let storageOK=true,tab='home',q='',dl=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,10)};
const today=()=>iso(new Date());
const dOff=n=>{const x=new Date();x.setDate(x.getDate()+n);return iso(x)};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=s=>{if(!s)return'';const d=new Date(s+'T12:00');const o={month:'short',day:'numeric'};if(d.getFullYear()!==new Date().getFullYear())o.year='numeric';return d.toLocaleDateString(undefined,o)};
const days=s=>Math.round((new Date(today()+'T12:00')-new Date(s+'T12:00'))/864e5);
const ago=s=>{if(!s)return'never';const n=days(s);return n<=0?'today':n===1?'yesterday':n<14?n+' days ago':fmt(s)};
const fmtTime=t=>{if(!t)return'';const[h,m]=t.split(':').map(Number);return((h%12)||12)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM')};
const blank=()=>({patient:{name:'',born:''},answers:{allergies:{t:'',u:''},investigating:{t:'',u:''},results:{t:'',u:''},hospital:{t:'',u:''},other:{t:'',u:''}},meds:[],visits:[],appts:[],sample:false});
const AQ=[['allergies','Allergies'],['investigating','Being investigated / ruled out'],['results','Latest test results'],['hospital','Hospital stays & ER visits'],['other','Anything else doctors should know']];
function sample(){const s=blank();s.sample=true;s.patient={name:'Maya',born:'2014-03-09'};
 s.answers={allergies:{t:'Penicillin (rash)',u:dOff(-80)},investigating:{t:'Joint pain + fatigue (Rheumatology)\nStomach pain (GI)\nRuled out: neurological cause for headaches (MRI normal)',u:dOff(-26)},results:{t:'MRI brain: normal\nBlood work: inflammation markers slightly elevated',u:dOff(-17)},hospital:{t:'Overnight at Children’s Hospital: dehydration + high fever',u:dOff(-40)},other:{t:'',u:''}};
 s.meds=[{id:uid(),name:'Omeprazole',dose:'20 mg once daily',by:'Dr. Ruiz (GI)',start:dOff(-54),status:'active',notes:'Before breakfast'},{id:uid(),name:'Acetaminophen',dose:'As needed for headaches',by:'Dr. Lee (Neurology)',start:dOff(-26),status:'active',notes:''},{id:uid(),name:'Ibuprofen',dose:'200 mg daily',by:'Pediatrician',start:dOff(-120),status:'stopped',stop:dOff(-26),reason:'Neurology asked to stop',notes:''}];
 s.visits=[{id:uid(),date:dOff(-17),specialty:'Rheumatology',doctor:'Dr. Okafor',summary:'Blood work ordered. Talked through the joint pain and fatigue pattern. No medication changes yet.',followup:'Results review at next visit'},{id:uid(),date:dOff(-26),specialty:'Neurology',doctor:'Dr. Lee',summary:'MRI normal. Headaches likely not neurological. Stop daily ibuprofen, use acetaminophen as needed.',followup:'None unless symptoms change'},{id:uid(),date:dOff(-40),specialty:'ER / admitted overnight',doctor:'Children’s Hospital',summary:'Dehydration and high fever. IV fluids, discharged next day.',followup:'See pediatrician within a week'},{id:uid(),date:dOff(-54),specialty:'Gastroenterology',doctor:'Dr. Ruiz',summary:'Started omeprazole. Asked us to keep a food diary.',followup:'Recheck in 8 weeks'}];
 s.appts=[{id:uid(),date:dOff(4),time:'09:30',specialty:'Rheumatology',doctor:'Dr. Okafor',where:'Children’s, Building 2',bring:'Symptom notes, list of questions'},{id:uid(),date:dOff(18),time:'14:00',specialty:'Gastroenterology',doctor:'Dr. Ruiz',where:'',bring:'Food diary'},{id:uid(),date:dOff(-3),time:'10:00',specialty:'Pediatrician',doctor:'Dr. Grant',where:'',bring:''}];
 return s}
function load(){try{const r=localStorage.getItem(K);return r?JSON.parse(r):null}catch(e){storageOK=false;return null}}
let S=load();
function save(){try{localStorage.setItem(K,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
function markBackup(){S.lastBackup=today();save();render()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const ICON={home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',visits:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7M9 8h3"/>',meds:'<rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-35 12 12)"/><path d="M9.5 8.5l5 7"/>',appts:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',more:'<path d="M4 6h16M4 12h16M4 18h16"/>'};
const TABS=[['home','Today'],['visits','Visits'],['meds','Meds'],['appts','Appts'],['more','Share']];
function navR(){$('#nav').innerHTML=S?TABS.map(([k,l])=>`<button data-act="tab" data-k="${k}" ${tab===k?'aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>${l}</button>`).join(''):''}
function head(){const n=S&&S.patient.name;$('#who').textContent=n?n+'’s Care Journal':'Health Vault';
 let sub='';if(S){if(S.patient.born){const a=Math.floor(days(S.patient.born)/365.25);sub='Age '+a+' · '}sub+=S.visits.length+' visits logged · '+activeMeds().length+' current meds'}$('#whosub').textContent=sub}
const activeMeds=()=>S.meds.filter(m=>m.status==='active');
const medsUpdated=()=>S.meds.reduce((a,m)=>[m.start,m.stop,m.u].filter(Boolean).reduce((x,y)=>y>x?y:x,a),'');
const upcoming=()=>S.appts.filter(a=>a.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
const pastUnlogged=()=>S.appts.filter(a=>a.date<today()&&!a.logged).sort((a,b)=>b.date.localeCompare(a.date));
function banners(){let h='';if(!storageOK)h+=`<div class="banner">This browser isn’t saving. Download a backup before closing.</div>`;
 if(S.sample)h+=`<div class="banner">You’re looking at sample data.<button class="btn mini" data-act="fresh">Start my own</button></div>`;
 else if(tab==='home'&&S.visits.length+S.meds.length>0&&(!S.lastBackup||days(S.lastBackup)>14))h+=`<div class="banner">${S.lastBackup?'Last backup '+ago(S.lastBackup)+'.':'No backup yet.'} This phone is the only copy.<button class="btn mini" data-act="download">Back up</button></div>`;return h}
function staleTag(u){return u&&days(u)>45?`<span class="stale">Last checked ${ago(u)}. Still right?</span>`:''}
function vHome(){const nx=upcoming()[0],am=activeMeds(),pu=pastUnlogged();
 let h=banners();
 h+=nx?`<div class="card next"><div class="meta">Next appointment · in ${-days(nx.date)} day${-days(nx.date)===1?'':'s'}</div><div class="when">${esc(fmt(nx.date))}${nx.time?' · '+fmtTime(nx.time):''}</div><div class="lbl" style="margin-top:4px">${esc(nx.specialty)}${nx.doctor?' · '+esc(nx.doctor):''}</div>${nx.where?`<div class="meta">${esc(nx.where)}</div>`:''}${nx.bring?`<div class="fu"><b>Bring:</b> ${esc(nx.bring)}</div>`:''}</div>`
 :`<div class="card"><div class="empty">No upcoming appointments.</div><div class="acts"><button class="btn mini" data-act="add-appt">Add one</button></div></div>`;
 if(pu.length)h+=`<button class="card tap" data-act="log-appt" data-id="${pu[0].id}"><div class="lbl">How did ${esc(pu[0].specialty)} on ${esc(fmt(pu[0].date))} go?</div><div class="meta">Tap to log it while it’s fresh</div></button>`;
 h+=`<h2>Quick answers <span>Tap any to update</span></h2>`;
 h+=`<button class="card tap" data-act="tab" data-k="meds"><div class="row"><div class="lbl">Current medications</div><div class="meta">Updated ${ago(medsUpdated())}</div></div><div class="val">${am.length?am.map(m=>esc(m.name+(m.dose?' — '+m.dose:''))).join('\n'):'<span class="empty">None listed</span>'}</div>${staleTag(medsUpdated())}</button>`;
 h+=AQ.map(([k,l])=>{const a=S.answers[k];return`<button class="card tap" data-act="edit-answer" data-k="${k}"><div class="row"><div class="lbl">${l}</div><div class="meta">${a.u?'Updated '+ago(a.u):'Not filled in'}</div></div><div class="val">${a.t?esc(a.t):'<span class="empty">Tap to add</span>'}</div>${staleTag(a.u)}</button>`}).join('');
 h+=`<div class="btns"><button class="btn p" data-act="add-visit">Log a visit</button><button class="btn" data-act="tab" data-k="more">Share summary</button></div>`;return h}
function visitCard(v){return`<button class="card tap" data-act="edit-visit" data-id="${v.id}"><div class="row"><div class="lbl">${esc(v.specialty)}</div><div class="meta">${esc(fmt(v.date))}</div></div>${v.doctor?`<div class="meta">${esc(v.doctor)}</div>`:''}${v.summary?`<div class="val">${esc(v.summary)}</div>`:''}${v.followup?`<div class="fu"><b>Follow-up:</b> ${esc(v.followup)}</div>`:''}</button>`}
function visitList(){const t=q.trim().toLowerCase();const l=[...S.visits].sort((a,b)=>b.date.localeCompare(a.date)).filter(v=>!t||[v.specialty,v.doctor,v.summary,v.followup].join(' ').toLowerCase().includes(t));
 return l.length?l.map(visitCard).join(''):`<div class="empty">${t?'No visits match “'+esc(q)+'”.':'No visits yet. Log the most recent one first, then work backwards when you have time.'}</div>`}
function vVisits(){return banners()+`<div class="btns one"><button class="btn p" data-act="add-visit">+ Log a visit</button></div><input type="search" id="q" placeholder="Search visits, doctors, notes" aria-label="Search visits" value="${esc(q)}"><div id="vlist" style="margin-top:12px">${visitList()}</div>`}
function medCard(m){const st=m.status==='stopped';return`<div class="card"><div class="row"><div class="lbl">${esc(m.name)}</div><div class="meta">${st?'Stopped '+esc(fmt(m.stop)):'Since '+esc(fmt(m.start))}</div></div>${m.dose?`<div class="val">${esc(m.dose)}</div>`:''}<div class="meta">${m.by?'Prescribed by '+esc(m.by):''}${st&&m.reason?' · '+esc(m.reason):''}</div>${m.notes?`<div class="fu">${esc(m.notes)}</div>`:''}<div class="acts"><button class="btn mini" data-act="edit-med" data-id="${m.id}">Edit</button>${st?'':`<button class="btn mini w" data-act="stop-med" data-id="${m.id}">Stop</button>`}</div></div>`}
function vMeds(){const a=activeMeds(),s=S.meds.filter(m=>m.status==='stopped').sort((x,y)=>(y.stop||'').localeCompare(x.stop||''));
 return banners()+`<div class="btns one"><button class="btn p" data-act="add-med">+ Add a medication</button></div><h2>Taking now <span>${a.length}</span></h2>${a.length?a.map(medCard).join(''):'<div class="empty">None listed.</div>'}${s.length?`<details><summary>Stopped (${s.length})</summary>${s.map(medCard).join('')}</details>`:''}`}
function apptCard(a,past){return`<div class="card"><div class="row"><div class="lbl">${esc(a.specialty)}</div><div class="meta">${esc(fmt(a.date))}${a.time?' · '+fmtTime(a.time):''}</div></div>${a.doctor?`<div class="meta">${esc(a.doctor)}${a.where?' · '+esc(a.where):''}</div>`:''}${a.bring?`<div class="fu"><b>Bring:</b> ${esc(a.bring)}</div>`:''}<div class="acts">${past?`<button class="btn mini p" data-act="log-appt" data-id="${a.id}">Log this visit</button>`:''}<button class="btn mini" data-act="edit-appt" data-id="${a.id}">Edit</button></div></div>`}
function vAppts(){const u=upcoming(),p=pastUnlogged();return banners()+`<div class="btns one"><button class="btn p" data-act="add-appt">+ Add an appointment</button></div><h2>Coming up <span>${u.length}</span></h2>${u.length?u.map(a=>apptCard(a,false)).join(''):'<div class="empty">Nothing scheduled.</div>'}${p.length?`<h2>Needs notes <span>${p.length}</span></h2>${p.map(a=>apptCard(a,true)).join('')}`:''}`}
function summaryText(){const L=[],P=S.patient;L.push('HEALTH SUMMARY'+(P.name?' — '+P.name:''));if(P.born)L.push('Born '+fmt(P.born));L.push('Prepared '+fmt(today())+' from their Care Journal','');
 L.push('CURRENT MEDICATIONS (updated '+ago(medsUpdated())+')');activeMeds().forEach(m=>L.push('• '+m.name+(m.dose?' — '+m.dose:'')+(m.by?' ('+m.by+')':'')));if(!activeMeds().length)L.push('• None');
 const st=S.meds.filter(m=>m.status==='stopped');if(st.length){L.push('Recently stopped:');st.slice(0,5).forEach(m=>L.push('• '+m.name+' — stopped '+fmt(m.stop)+(m.reason?', '+m.reason:'')))}
 AQ.forEach(([k,l])=>{const a=S.answers[k];if(a.t){L.push('',l.toUpperCase()+(a.u?' (updated '+ago(a.u)+')':''));a.t.split('\n').forEach(x=>x.trim()&&L.push('• '+x.trim()))}});
 const v=[...S.visits].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10);if(v.length){L.push('','RECENT VISITS');v.forEach(x=>L.push('• '+fmt(x.date)+' — '+x.specialty+(x.doctor?', '+x.doctor:'')+(x.summary?': '+x.summary:'')+(x.followup?' Follow-up: '+x.followup:'')))}
 const u=upcoming();if(u.length){L.push('','UPCOMING');u.forEach(a=>L.push('• '+fmt(a.date)+' — '+a.specialty+(a.doctor?', '+a.doctor:'')))}
 return L.join('\n')}
function vMore(){return banners()+`<h2>Summary for a doctor</h2><p class="meta" style="margin-top:-4px">Show this screen at check-in, or copy it into a patient-portal message.</p><div class="card summary">${esc(summaryText())}</div><div class="btns one"><button class="btn p" data-act="copy-summary">Copy summary</button></div>
<h2>Patient details</h2><button class="card tap" data-act="edit-patient"><div class="lbl">${esc(S.patient.name||'Add the patient’s name')}</div><div class="meta">${S.patient.born?'Born '+esc(fmt(S.patient.born)):'Add date of birth'}</div></button>
<h2>Backup</h2><div class="card"><div class="val" style="margin-top:0">Everything is saved on this phone only. Save a backup every week or two, and keep it in your files, Drive or email.</div><div class="meta" style="margin-top:6px">${storageOK?'Saving on this device: on':'Saving on this device: not available in this browser'} · Last backup: ${S.lastBackup?ago(S.lastBackup):'never'}</div><div class="acts"><button class="btn mini p" data-act="download">Save backup file</button><button class="btn mini" data-act="copy-backup">Copy backup</button><button class="btn mini" data-act="restore">Restore</button></div></div>
<h2>Put it on the home screen</h2><div class="card"><b>iPhone (Safari):</b><ol class="how"><li>Tap the Share button</li><li>Choose “Add to Home Screen”</li></ol><b>Android (Chrome):</b><ol class="how"><li>Tap the ⋮ menu</li><li>Choose “Add to Home screen”</li></ol><div class="meta">After that, always open it from the home-screen icon. It works without signal, and that’s where the record lives.</div></div>
<div class="btns one" style="margin-top:22px"><button class="btn w" data-act="wipe">Erase everything on this phone</button></div>`}
const installed=()=>{try{return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}catch(e){return false}};
const mobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
function vWelcome(){return`<div class="welcome">${mobile&&!installed()?`<div class="banner" style="display:block">Before you start: add this to your home screen, then open it from the icon. On iPhone, what you enter in Safari doesn’t carry over to the home-screen app.<ol class="how" style="font-weight:500"><li>iPhone: Share button → Add to Home Screen</li><li>Android: ⋮ menu → Add to Home screen</li></ol></div>`:''}<h2 style="font-size:24px">One place for every appointment, medication and result</h2><p>Log each visit in a minute. Keep the answers doctors ask every time up to date, each with the date it was last checked. Hand over a clean summary instead of a verbal history.</p><p>Everything stays on this phone. Nothing is sent anywhere.</p><div class="btns one"><button class="btn p" data-act="fresh">Start a Care Journal</button><button class="btn" data-act="try">Look around with sample data first</button></div></div>`}
function render(){head();navR();const v={home:vHome,visits:vVisits,meds:vMeds,appts:vAppts,more:vMore};$('#app').innerHTML=S?v[tab]():vWelcome();
 const qi=$('#q');if(qi)qi.addEventListener('input',e=>{q=e.target.value;$('#vlist').innerHTML=visitList()})}
function sheet(inner){$('#layer').innerHTML=`<div class="sheet" data-act="close-bg"><div role="dialog" aria-modal="true">${inner}</div></div>`;const f=$('#layer input,#layer textarea');if(f)f.focus()}
const close=()=>{$('#layer').innerHTML=''};
function form(o){const fs=o.fields.map(f=>{const v=esc(o.values?.[f.k]??f.def??'');const id='f_'+f.k;const lab=`<label for="${id}">${f.l}${f.req?' <span class="req">*</span>':''}</label>`;
  return lab+(f.t==='area'?`<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}">${v}</textarea>`:`<input id="${id}" name="${f.k}" type="${f.t||'text'}" value="${v}" placeholder="${esc(f.ph||'')}">`)}).join('');
 sheet(`<form class="f" id="sf"><div class="row"><h3>${o.title}</h3><button type="button" class="btn mini" data-act="close">Cancel</button></div>${o.hint?`<div class="meta" style="margin-top:6px">${o.hint}</div>`:''}${fs}<div class="btns ${o.onDelete?'':'one'}" style="margin-top:18px">${o.onDelete?'<button type="button" class="btn w" id="sdel">Delete</button>':''}<button class="btn p" type="submit">Save</button></div><div class="meta" id="serr" style="color:var(--warn)"></div></form>`);
 $('#sf').addEventListener('submit',e=>{e.preventDefault();const d={};o.fields.forEach(f=>d[f.k]=e.target.elements[f.k].value.trim());const miss=o.fields.find(f=>f.req&&!d[f.k]);if(miss){$('#serr').textContent=miss.l+' is needed.';return}o.onSave(d);save();close();render();toast('Saved')});
 if(o.onDelete)$('#sdel').addEventListener('click',()=>confirmBox('Delete this for good?',()=>{o.onDelete();save();render();toast('Deleted')}))}
function confirmBox(msg,yes){sheet(`<h3>${esc(msg)}</h3><div class="btns" style="margin-top:18px"><button class="btn" data-act="close">Keep it</button><button class="btn p" id="cyes">Yes</button></div>`);$('#cyes').addEventListener('click',()=>{close();yes()})}
const VF=[{k:'date',l:'Date',t:'date',req:1},{k:'specialty',l:'Specialty or place',req:1,ph:'e.g. Cardiology, ER, Pediatrician'},{k:'doctor',l:'Doctor',ph:'Name'},{k:'summary',l:'What happened / what they said',t:'area',ph:'Findings, tests ordered, diagnoses ruled in or out'},{k:'followup',l:'Follow-up',ph:'Next step, test, or appointment'}];
const MF=[{k:'name',l:'Medication',req:1},{k:'dose',l:'Dose & how often',ph:'e.g. 10 mg twice a day'},{k:'by',l:'Prescribed by',ph:'Doctor or specialty'},{k:'start',l:'Started',t:'date'},{k:'notes',l:'Notes',t:'area',ph:'With food, side effects, why'}];
const AF=[{k:'date',l:'Date',t:'date',req:1},{k:'time',l:'Time',t:'time'},{k:'specialty',l:'Specialty',req:1},{k:'doctor',l:'Doctor'},{k:'where',l:'Where'},{k:'bring',l:'Bring / ask about',t:'area'}];
function visitForm(v,fromAppt){form({title:v?.id?'Edit visit':'Log a visit',hint:'Only date and specialty are needed. Add the rest when you can.',fields:VF,values:v||{date:today()},
 onSave:d=>{if(v?.id)Object.assign(S.visits.find(x=>x.id===v.id),d);else S.visits.push({id:uid(),...d});if(fromAppt)fromAppt.logged=true},
 onDelete:v?.id?()=>{S.visits=S.visits.filter(x=>x.id!==v.id)}:null})}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){sheet(`<div class="f"><div class="row"><h3>Copy this</h3><button class="btn mini" data-act="close">Done</button></div><div class="meta" style="margin:6px 0">Press and hold, then Select All and Copy.</div><textarea readonly style="min-height:240px">${esc(text)}</textarea></div>`);const t=$('#layer textarea');t.focus();t.select()}}
const backup=()=>JSON.stringify({app:'care-journal',v:1,saved:today(),data:S},null,1);
const A={
 tab:e=>{tab=e.dataset.k;render();scrollTo(0,0)},close,'close-bg':(e,ev)=>{if(ev.target===e)close()},
 fresh:()=>{if(S&&!S.sample)return;S=blank();save();tab='more';render();form({title:'Who is this Care Journal for?',fields:[{k:'name',l:'What is the patient’s name?',req:1},{k:'born',l:'Date of birth',t:'date'}],onSave:d=>{S.patient=d;tab='home'}})},
 try:()=>{S=sample();save();tab='home';render()},
 'edit-answer':e=>{const k=e.dataset.k,a=S.answers[k];form({title:AQ.find(x=>x[0]===k)[1],hint:'One item per line. Saving stamps today’s date, so doctors know it’s current.',fields:[{k:'t',l:'Details',t:'area'}],values:{t:a.t},onSave:d=>{a.t=d.t;a.u=today()}})},
 'add-visit':()=>visitForm(null),'edit-visit':e=>visitForm(S.visits.find(x=>x.id===e.dataset.id)),
 'log-appt':e=>{const a=S.appts.find(x=>x.id===e.dataset.id);visitForm({date:a.date,specialty:a.specialty,doctor:a.doctor},a)},
 'add-med':()=>form({title:'Add a medication',fields:MF,values:{start:today()},onSave:d=>S.meds.push({id:uid(),status:'active',...d})}),
 'edit-med':e=>{const m=S.meds.find(x=>x.id===e.dataset.id);form({title:'Edit '+esc(m.name),fields:m.status==='stopped'?MF.concat([{k:'stop',l:'Stopped',t:'date'},{k:'reason',l:'Why stopped'}]):MF,values:m,onSave:d=>{Object.assign(m,d);m.u=today()},onDelete:()=>{S.meds=S.meds.filter(x=>x.id!==m.id)}})},
 'stop-med':e=>{const m=S.meds.find(x=>x.id===e.dataset.id);form({title:'Stop '+esc(m.name),hint:'It moves to “Stopped” so the history stays.',fields:[{k:'stop',l:'Stopped on',t:'date',req:1},{k:'reason',l:'Why / who said so',ph:'e.g. Neurology asked to stop'}],values:{stop:today()},onSave:d=>{m.status='stopped';m.stop=d.stop;m.reason=d.reason}})},
 'add-appt':()=>form({title:'Add an appointment',fields:AF,onSave:d=>S.appts.push({id:uid(),...d})}),
 'edit-appt':e=>{const a=S.appts.find(x=>x.id===e.dataset.id);form({title:'Edit appointment',fields:AF,values:a,onSave:d=>Object.assign(a,d),onDelete:()=>{S.appts=S.appts.filter(x=>x.id!==a.id)}})},
 'edit-patient':()=>form({title:'Patient details',fields:[{k:'name',l:'Patient’s name',req:1},{k:'born',l:'Date of birth',t:'date'}],values:S.patient,onSave:d=>{S.patient=d}}),
 'copy-summary':()=>copy(summaryText()),'copy-backup':()=>copy(backup()),
 download:async()=>{const name='health-vault-backup-'+today()+'.json',blob=new Blob([backup()],{type:'application/json'});
  try{const f=new File([blob],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[f],title:'Health Vault backup'});markBackup();toast('Backup ready');return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);markBackup();toast('Backup saved')}catch(e){copy(backup())}},
 restore:()=>$('#restore').click(),
 wipe:()=>confirmBox('Erase this whole Care Journal from this phone? Save a backup first if you might need it.',()=>{try{localStorage.removeItem(K)}catch(e){}S=null;tab='home';render()})
};
document.addEventListener('click',ev=>{const e=ev.target.closest('[data-act]');if(!e)return;const f=A[e.dataset.act];if(f){if(e.tagName==='BUTTON'&&e.type!=='submit')ev.preventDefault();f(e,ev)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&$('#layer').innerHTML)close()});
$('#restore').addEventListener('change',ev=>{const file=ev.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);const d=j.data||j;if(!Array.isArray(d.visits)||!d.answers)throw 0;confirmBox('Replace what’s on this phone with the backup from '+(j.saved?fmt(j.saved):'that file')+'?',()=>{S=d;save();tab='home';render();toast('Restored')})}catch(e){toast('That file isn’t a Health Vault backup')}ev.target.value=''};r.readAsText(file)});
if(S&&S.sample){/* keep sample dates feeling current */}
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
}
</script>
</body>
</html>
